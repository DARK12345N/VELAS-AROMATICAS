<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Aroma Tech</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo"><img src="imagenes/logo%20.png" alt="Aroma Tech - Velas Aromáticas"></div>
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link">Inicio</a></li>
                    <li><a href="productos.html" class="nav-link">Productos</a></li>
                    <li><a href="nosotros.html" class="nav-link">Nosotros</a></li>
                    <li><a href="contacto.html" class="nav-link">Contacto</a></li>
                    <li><a href="#cart" class="nav-link cart-link"><i class="fas fa-shopping-cart"></i><span class="cart-count">0</span></a></li>
                </ul>
                <div class="hamburger"><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
            </div>
        </nav>
    </header>

    <main class="products-section page-content">
        <div class="container">
            <h1 class="section-title">Nuestros Productos</h1>
            <div class="products-grid" id="products-grid"></div>
        </div>
    </main>

    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h2>Carrito de Compras</h2><span class="close">&times;</span></div>
            <div class="modal-body">
                <div id="cart-items"></div>
                <div class="cart-total"><h3>Total: Bs <span id="cart-total">0.00</span></h3></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="clear-cart">Vaciar Carrito</button>
                <button class="btn btn-primary" id="checkout"><i class="fas fa-print"></i> Imprimir recibo</button>
            </div>
        </div>
    </div>

    <div id="product-modal" class="modal">
        <div class="modal-content product-modal-content"><span class="close">&times;</span><div id="product-detail"></div></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
